name: IndexNow

# После выкладки сайта в Cloudflare отправляет URL из sitemap.xml в IndexNow
# (Яндекс, Bing и другие участники). Ключ публичный, лежит в корне сайта.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - webinar/**
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      HOST: annaovrakh.com
      KEY: 9372f59a2370199123dbadf513043901
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Workers Builds: annaovrakh")] | .[0].conclusion // "pending"')
            echo "attempt $i: $conclusion"
            if [ "$conclusion" = "success" ]; then exit 0; fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "Cloudflare build did not succeed, not submitting"
              exit 1
            fi
            sleep 15
          done
          echo "Cloudflare build did not finish in 10 minutes"
          exit 1

      - name: Check that the key file is live
        run: |
          body=$(curl -fsS "https://${HOST}/${KEY}.txt")
          test "$body" = "$KEY"

      - name: Submit URLs from sitemap.xml
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##')
          payload=$(printf '%s\n' "$urls" | jq -R . | jq -s \
            --arg host "$HOST" --arg key "$KEY" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: .}')
          echo "$payload"
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "https://yandex.com/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' -d "$payload")
          echo "HTTP $code"
          cat response.txt
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then exit 1; fi
