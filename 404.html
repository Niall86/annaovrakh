<!doctype html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Анна Оврах</title>
  <meta name="description" content="Такой страницы нет. Перейдите на главную или посмотрите бесплатный вебинар.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/meta/favicon-512.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="/assets/meta/favicon-180.png">
  <style>
    :root { --bg: #f5f3ef; --text: #151515; --muted: #6b6963; --accent: #c8283a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header { padding: 20px 24px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none;
             font-size: 14px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }
    .brand img { width: 40px; height: auto; display: block; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center;
           max-width: 720px; width: 100%; margin: 0 auto; padding: 24px; }
    .eyebrow { margin: 0 0 16px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .code { color: var(--accent); }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; letter-spacing: -.03em; font-weight: 600; }
    p.lead { margin: 0 0 32px; font-size: 18px; line-height: 1.5; color: var(--muted); max-width: 520px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-block; padding: 14px 24px; border-radius: 999px; font-size: 16px; font-weight: 500;
           text-decoration: none; border: 1px solid var(--text); transition: background .15s, color .15s; }
    .btn.primary { background: var(--text); color: var(--bg); }
    .btn.primary:hover { background: #000; }
    .btn.ghost { color: var(--text); }
    .btn.ghost:hover { background: var(--text); color: var(--bg); }
    .btn:focus-visible, .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    footer { padding: 20px 24px; font-size: 13px; color: var(--muted); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="/assets/images/image-9e5f11c0.png" alt="" width="40" height="31">
      <span>Anna Ovrakh</span>
    </a>
  </header>

  <main>
    <p class="eyebrow"><span class="code">404</span> · страница не найдена</p>
    <h1>Такой страницы нет</h1>
    <p class="lead">Возможно, ссылка устарела или в адресе опечатка. Перейдите на главную или посмотрите бесплатный вебинар.</p>
    <div class="actions">
      <a class="btn primary" href="/">На главную</a>
      <a class="btn ghost" href="/webinar/">Бесплатный вебинар</a>
    </div>
  </main>

  <footer>
    <a href="mailto:hello@annaovrakh.com">hello@annaovrakh.com</a>
  </footer>
</body>
</html>
